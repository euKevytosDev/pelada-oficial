spring.application.name=Pelada Oficial
server.port=${PORT:8080}

# local = H2 no PC | postgres = Neon/Render (defina SPRING_PROFILES_ACTIVE=postgres)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Em produção defina APP_JWT_SECRET (mín. 32 caracteres)
# Login fica salvo ~90 dias (7776000000 ms) até clicar em Sair
app.jwt.secret=${APP_JWT_SECRET:pelada-oficial-segredo-dev-mude-em-producao-1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:7776000000}

# Client ID do Google Identity Services (público no front; validado no back)
app.google.client-id=${GOOGLE_CLIENT_ID:14692725836-8n7a4aisfk1sjmvadnn400joq1j6rjdi.apps.googleusercontent.com}

# Pelada Pro (web / Mercado Pago). Vazio = checkout desligado; o teste de 7 dias continua.
app.assinatura.trial-dias=${APP_ASSINATURA_TRIAL_DIAS:7}
app.assinatura.front-url=${APP_FRONT_URL:https://eukevytosdev.github.io/pelada-oficial/}
app.assinatura.webhook-url=${APP_ASSINATURA_WEBHOOK_URL:https://147.15.38.121.sslip.io/api/assinatura/webhook}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
