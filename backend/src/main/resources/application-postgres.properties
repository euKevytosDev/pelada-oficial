# Perfil PostgreSQL — Neon / Render / Docker
# Ative com: SPRING_PROFILES_ACTIVE=postgres
#
# No Neon: Connection details → formato "JDBC" → copie URL, user e password.
# A URL do Neon já traz ?sslmode=require

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pelada_oficial}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pelada}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon Free: pool solta conexão quando ninguém usa, para o compute poder dormir.
# Em pelada ativa a conexão volta sozinha; a 1ª após o sono pode levar 1–3s.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.validation-timeout=5000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
